<form #formAddTask name="form-add-task" (submit)="submitNewTask(taskInput.value, descriptionInput.value); $event.preventDefault()">
  <label for="inputTask">Task Name: </label>
    <input #taskInput required type="text" name="taskInput" placeholder="Enter task name">
    <textarea #descriptionInput type="text" name="descriptionInput" placeholder="Enter description" rows="5" cols="30"></textarea>
  <button type="submit">Add Task</button>
</form>

<p>{{debugOutput}}</p>
