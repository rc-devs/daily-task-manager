<form #form name="form" (submit)="onSubmit(); $event.preventDefault()">
  <app-task-card></app-task-card>

@if (getTaskStatus()){
  <app-add-task></app-add-task>
} @else if (!getTaskStatus()){
  <button type="button" (click)="onAddNewTask()">Add New Task</button>
}
  <hr>
  <button type="submit">Submit</button>
</form>
